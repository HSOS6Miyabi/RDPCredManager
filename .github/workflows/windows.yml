name: Windows multi-architecture build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            vsarch: amd64_x86
            filename: RDPCredManager-Win32.exe
          - arch: x64
            vsarch: amd64
            filename: RDPCredManager-Win64.exe
          - arch: arm64
            vsarch: amd64_arm64
            filename: RDPCredManager-ARM64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vsarch }}
      - name: Build native application
        shell: cmd
        run: call build_windows.cmd ${{ matrix.arch }}
      - name: Build architecture-matched tests
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /EHsc /utf-8 /Fe:build\core_test.exe tests\core_test.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /utf-8 /Fe:build\layout_test.exe tests\layout_test.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /utf-8 /Fe:build\favorites_test.exe tests\favorites_test.cpp
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /utf-8 /Fe:build\win_credential_test.exe tests\win_credential_test.cpp advapi32.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /EHsc /utf-8 /Fe:build\win_gui_test.exe tests\win_gui_test.cpp advapi32.lib user32.lib
          if errorlevel 1 exit /b 1
      - name: Run native x86 and x64 integration tests
        if: matrix.arch != 'arm64'
        shell: cmd
        run: |
          build\core_test.exe
          if errorlevel 1 exit /b 1
          build\layout_test.exe
          if errorlevel 1 exit /b 1
          build\favorites_test.exe
          if errorlevel 1 exit /b 1
          build\win_credential_test.exe
          if errorlevel 1 exit /b 1
          build\manifest_verify.exe RDPCredManager.exe ${{ matrix.arch }}
          if errorlevel 1 exit /b 1
          build\win_gui_test.exe
          if errorlevel 1 exit /b 1
      - name: Prepare testable artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item RDPCredManager.exe "staging/${{ matrix.filename }}"
          foreach ($file in @('manifest_verify.exe','core_test.exe','layout_test.exe','favorites_test.exe','win_credential_test.exe','win_gui_test.exe')) {
            Copy-Item "build/$file" "staging/$file"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error

  arm64-native:
    name: ARM64 native tests
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-arm64
          path: arm64
      - name: Execute Windows ARM64 binaries and verify manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$PWD/arm64;$env:PATH"
          $commands = @(
            @('manifest_verify.exe','RDPCredManager-ARM64.exe','arm64'),
            @('core_test.exe'),
            @('layout_test.exe'),
            @('favorites_test.exe'),
            @('win_credential_test.exe')
          )
          Push-Location arm64
          try {
            foreach ($cmd in $commands) {
              $name=$cmd[0]
              $argsList = if ($cmd.Count -gt 1) { $cmd[1..($cmd.Count-1)] } else { @() }
              & "./$name" @argsList
              if ($LASTEXITCODE -ne 0) { throw "$name failed: $LASTEXITCODE" }
            }
            Copy-Item RDPCredManager-ARM64.exe RDPCredManager.exe
            & ./win_gui_test.exe
            if ($LASTEXITCODE -ne 0) { throw "ARM64 GUI integration failed: $LASTEXITCODE" }
          } finally { Pop-Location }

  release:
    name: Publish verified three-architecture release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, arm64-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
      - name: Assemble release and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/build-x86/RDPCredManager-Win32.exe dist/
          cp artifacts/build-x64/RDPCredManager-Win64.exe dist/
          cp artifacts/build-arm64/RDPCredManager-ARM64.exe dist/
          git archive --format=zip --output=dist/RDPCredManager-source.zip HEAD
          (cd dist && sha256sum RDPCredManager-Win32.exe RDPCredManager-Win64.exe RDPCredManager-ARM64.exe RDPCredManager-source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RDPCredManager-release-assets
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag=v4.2.0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. No assets overwritten."
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "RDP Credential Manager $tag" \
              --notes "Native Windows x86 (32-bit), x64 and ARM64 builds. Windows Credential Manager API tests, GUI integration tests, favorites registry persistence and embedded manifest verification run on native-capable Windows runners before release."
          fi
